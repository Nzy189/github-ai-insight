services:
  github-ai-insight:
    build: .
    image: github-ai-insight:latest
    container_name: github-ai-insight
    restart: unless-stopped

    # 刻意不使用 env_file —— 那会在「容器创建时」把变量烤进环境，
    # 之后改 .env 再 restart 是不生效的，必须 up -d 重建。
    # 改成把 .env 挂进容器，由应用在「进程启动时」读文件，
    # 这样 `docker compose restart` 就能真正让新配置生效。
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro

    # 这几项必须是真环境变量（进程起来前就要生效），
    # 用 compose 自身的变量插值从 ./.env 取值。
    # 注意：改这三个仍需 `docker compose up -d`，因为插值发生在创建时。
    environment:
      TZ: "${TIMEZONE:-Asia/Dubai}"
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      DATA_DIR: "/app/data"

    ports:
      - "${HTTP_PORT:-8080}:8080"

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sqlite3; sqlite3.connect('/app/data/github_ai_insight.db').close()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
